name: Reset public demo
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: privio-demo-reset
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      DEMO_MODE: 'true'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --no-dev
      - name: Restore only the allowlisted demo examples
        run: uv run python -m scripts.demo --reset
