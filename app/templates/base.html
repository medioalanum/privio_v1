<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t('app_title') }}{% endblock %}</title>
    
    <!-- Pico.css CDN (v2) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    
    <style>
        :root {
            --pico-font-size: 95%;
        }
        .metric-card {
            padding: 1.25rem;
            border-radius: 8px;
            background: var(--pico-card-background-color);
            box-shadow: var(--pico-card-box-shadow);
            margin-bottom: 1rem;
        }
        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0.25rem 0;
        }
        .metric-sub {
            font-size: 0.85rem;
            color: var(--pico-muted-color);
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending { background-color: #f59e0b; color: #000; }
        .badge-paid { background-color: #10b981; color: #fff; }
        .badge-recurrence { background-color: var(--pico-primary-background); color: var(--pico-primary-inverse); }
        .badge-estimate { background-color: #6366f1; color: #fff; }
        .badge-role { background-color: #3b82f6; color: #fff; font-size: 0.7rem; margin-left: 0.5rem; }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            background: var(--pico-background-color);
            padding: 1.5rem;
            border-radius: 8px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .action-btns {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .action-btns button, .action-btns a {
            align-items: center;
            display: inline-flex;
            height: 2.35rem;
            justify-content: center;
            margin: 0;
            padding: 0;
            width: 2.35rem;
            flex: 0 0 2.35rem;
        }
        .action-btns svg {
            height: 1.05rem;
            pointer-events: none;
            stroke: currentColor;
            width: 1.05rem;
        }
        .action-btns .action-delete {
            border-color: #ef4444;
            color: #ef4444;
        }
        .lang-link {
            font-size: 0.85rem;
            padding: 0.2rem 0.4rem;
            text-decoration: none;
            border-radius: 4px;
        }
        .lang-link.active {
            font-weight: bold;
            background-color: var(--pico-primary-background);
            color: var(--pico-primary-inverse);
        }
        .month-navigation {
            align-items: center;
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .month-navigation button {
            height: 2.5rem;
            margin: 0;
            padding: 0;
            width: 2.5rem;
        }
        .month-navigation { flex-wrap: wrap; }
        .month-navigation a[role="button"] { margin: 0; padding: .35rem .8rem; }
        .month-form, .filters, .quick-actions { display: flex; gap: .7rem; flex-wrap: wrap; align-items: end; }
        .month-form { margin: 0; }
        .month-form label { margin: 0; }
        .month-navigation .month-form button { width: auto; padding: .5rem; height: auto; }
        .filters label { flex: 1 1 150px; }
        .metric-value, td strong { white-space: nowrap; }
        .overflow-auto { overflow-x: auto; max-width: 100%; }
        .nature-label { display: block; color: var(--pico-muted-color); }
        :focus-visible { outline: 3px solid var(--pico-primary); outline-offset: 3px; }
        [aria-busy="true"] { opacity: .6; }
        .grid-cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
        @media (max-width: 600px) {
            .month-navigation { display:grid; grid-template-columns:auto 1fr auto; gap:.5rem; }
            .month-navigation strong { text-align:center; }
            .month-form { grid-column:1 / -1; grid-row:2; }
            .month-form label { flex:1; }
            .month-navigation > a:not([role]) { grid-column:1 / -1; text-align:center; }
            .month-navigation > a[aria-label]:last-child { grid-column:3; grid-row:1; }
            .grid-cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem; }
            .metric-value { font-size:1.15rem !important; }
            #upcoming-section table, #upcoming-section tbody, #upcoming-section tr, #upcoming-section td { display:block; }
            #upcoming-section thead { display:none; }
            #upcoming-section tr { padding:.5rem 0; border-bottom:1px solid var(--pico-muted-border-color); }
            #upcoming-section td { padding:.3rem; }
            #upcoming-section .action-btns { flex-wrap:wrap; }
 header nav, header nav ul { flex-wrap: wrap; } .metric-card { padding: .8rem; } .metric-value { font-size: 1.45rem; } }
        .month-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .month-cards .metric-card { margin: 0; }
        .positive { color: #34d399; } .negative { color: #f87171; }
        .month-alerts { margin: 0 0 1.5rem; } .month-alerts p { margin: .4rem 0; }
        .notice { padding: .8rem 1rem; border-left: 3px solid var(--pico-primary); }
        .action-btns { flex-wrap: wrap; }
        .action-btns .payment-label { width: auto; flex: 0 1 auto; height: auto; padding: .5rem .7rem; white-space: normal; }
        .secondary-actions { margin: 0; } .secondary-actions summary { font-size: .85rem; }
        .filter-panel { margin: .5rem 0; }
        @media(max-width:600px) { .month-cards {grid-template-columns:1fr;} .month-cards .metric-card {display:grid;grid-template-columns:1fr auto;gap:.25rem;} .month-cards .metric-card small:last-child {grid-column:1 / -1;} }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li>
                    <strong>💰 {{ t('app_name') }}</strong>
                    {% if user %}
                        <span class="badge badge-role">{{ user.role.label }}</span>
                    {% endif %}
                </li>
            </ul>
            <ul>
                <li>
                    <div style="display: flex; gap: 0.3rem; align-items: center;">
                        <a href="?lang=pt{% if selected_month_key %}&month={{ selected_month_key }}{% endif %}" class="lang-link {% if lang == 'pt' %}active{% endif %}">🇧🇷 PT</a>
                        <a href="?lang=en{% if selected_month_key %}&month={{ selected_month_key }}{% endif %}" class="lang-link {% if lang == 'en' %}active{% endif %}">🇺🇸 EN</a>
                        <a href="?lang=it{% if selected_month_key %}&month={{ selected_month_key }}{% endif %}" class="lang-link {% if lang == 'it' %}active{% endif %}">🇮🇹 IT</a>
                    </div>
                </li>
                <li><a href="/?lang={{ lang }}{% if selected_month_key %}&month={{ selected_month_key }}{% endif %}" class="contrast">{{ t('dashboard') }}</a></li>
                {% if user and user.role.value == "editor" %}<li><a href="/docs" target="_blank" class="secondary">{{ t('swagger_api') }}</a></li>{% endif %}
                <li>
                    <form action="/logout" method="post" style="margin: 0;">
                        <button type="submit" class="outline secondary" style="margin: 0; padding: .45rem .8rem;">{{ t('logout') }}</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div id="toast-container" role="status" aria-live="polite"></div>
        {% block content %}{% endblock %}
    </main>

    <!-- Global Modal target for HTMX dialogs -->
    <div id="modal-container"></div>

    <footer class="container" style="text-align: center; margin-top: 3rem; font-size: 0.85rem; color: var(--pico-muted-color);">
        <p>{{ t('footer_text') }}</p>
    </footer>

    <script>
        document.body.addEventListener('htmx:responseError', function () {
            document.getElementById('toast-container').textContent = {{ t('operation_error') | tojson }};
        });
        document.body.addEventListener('htmx:sendError', function () {
            document.getElementById('toast-container').textContent = {{ t('operation_error') | tojson }};
        });
        let modalOpener = null;
        document.body.addEventListener('htmx:beforeRequest', function (event) {
            if (event.detail.target && event.detail.target.id === 'modal-container') modalOpener = document.activeElement;
        });
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (event.detail.target.id !== 'modal-container') return;
            const dialog = event.detail.target.querySelector('.modal-content');
            if (!dialog) return;
            dialog.setAttribute('role', 'dialog');
            dialog.setAttribute('aria-modal', 'true');
            const heading = dialog.querySelector('h4');
            if (heading) { heading.id = 'modal-heading'; dialog.setAttribute('aria-labelledby', heading.id); }
            const first = dialog.querySelector('input:not([type="hidden"]):not([disabled]), select, button');
            if (first) first.focus();
        });
        document.addEventListener('keydown', function (event) {
            const dialog = document.querySelector('#modal-container .modal-content');
            if (!dialog) return;
            if (event.key === 'Escape') { event.preventDefault(); closeModal(); }
            if (event.key === 'Tab') {
                const fields = [...dialog.querySelectorAll('button, input:not([type="hidden"]), select, textarea, a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
                const first = fields[0], last = fields[fields.length - 1];
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            }
        });
        function closeModal() {
            const modal = document.getElementById('modal-container');
            if (modal) modal.innerHTML = '';
            if (modalOpener && modalOpener.isConnected) modalOpener.focus();
        }
    </script>
</body>
</html>
