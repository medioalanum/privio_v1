<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t('app_title') }}{% endblock %}</title>
    
    <!-- Pico.css CDN (v2) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    
    <style>
        :root {
            --pico-font-size: 95%;
        }
        .metric-card {
            padding: 1.25rem;
            border-radius: 8px;
            background: var(--pico-card-background-color);
            box-shadow: var(--pico-card-box-shadow);
            margin-bottom: 1rem;
        }
        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0.25rem 0;
        }
        .metric-sub {
            font-size: 0.85rem;
            color: var(--pico-muted-color);
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending { background-color: #f59e0b; color: #000; }
        .badge-paid { background-color: #10b981; color: #fff; }
        .badge-recurrence { background-color: var(--pico-primary-background); color: var(--pico-primary-inverse); }
        .badge-estimate { background-color: #6366f1; color: #fff; }
        .badge-role { background-color: #3b82f6; color: #fff; font-size: 0.7rem; margin-left: 0.5rem; }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            background: var(--pico-background-color);
            padding: 1.5rem;
            border-radius: 8px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .action-btns {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .action-btns button, .action-btns a {
            align-items: center;
            display: inline-flex;
            height: 2.35rem;
            justify-content: center;
            margin: 0;
            padding: 0;
            width: 2.35rem;
        }
        .action-btns svg {
            height: 1.05rem;
            pointer-events: none;
            stroke: currentColor;
            width: 1.05rem;
        }
        .action-btns .action-delete {
            border-color: #ef4444;
            color: #ef4444;
        }
        .lang-link {
            font-size: 0.85rem;
            padding: 0.2rem 0.4rem;
            text-decoration: none;
            border-radius: 4px;
        }
        .lang-link.active {
            font-weight: bold;
            background-color: var(--pico-primary-background);
            color: var(--pico-primary-inverse);
        }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li>
                    <strong>💰 {{ t('app_name') }}</strong>
                    {% if user %}
                        <span class="badge badge-role">{{ user.role.value }}</span>
                    {% endif %}
                </li>
            </ul>
            <ul>
                <li>
                    <div style="display: flex; gap: 0.3rem; align-items: center;">
                        <a href="?lang=pt" class="lang-link {% if lang == 'pt' %}active{% endif %}">🇧🇷 PT</a>
                        <a href="?lang=en" class="lang-link {% if lang == 'en' %}active{% endif %}">🇺🇸 EN</a>
                        <a href="?lang=it" class="lang-link {% if lang == 'it' %}active{% endif %}">🇮🇹 IT</a>
                    </div>
                </li>
                <li><a href="/?lang={{ lang }}" class="contrast">{{ t('dashboard') }}</a></li>
                <li><a href="/docs" target="_blank" class="secondary">{{ t('swagger_api') }}</a></li>
                <li>
                    <form action="/logout" method="post" style="margin: 0;">
                        <button type="submit" class="outline secondary" style="margin: 0; padding: .45rem .8rem;">Sair</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div id="toast-container"></div>
        {% block content %}{% endblock %}
    </main>

    <!-- Global Modal target for HTMX dialogs -->
    <div id="modal-container"></div>

    <footer class="container" style="text-align: center; margin-top: 3rem; font-size: 0.85rem; color: var(--pico-muted-color);">
        <p>{{ t('footer_text') }}</p>
    </footer>

    <script>
        function closeModal() {
            const modal = document.getElementById('modal-container');
            if (modal) modal.innerHTML = '';
        }
    </script>
</body>
</html>
