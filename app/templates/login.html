<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Privio</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --ink: #eef7ff;
            --muted: #9db0c6;
            --line: rgba(255, 255, 255, .14);
            --accent: #70e1c1;
            --accent-2: #73a7ff;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, rgba(54, 210, 170, .26), transparent 34%),
                radial-gradient(circle at 88% 78%, rgba(72, 105, 230, .34), transparent 38%),
                linear-gradient(135deg, #07111d 0%, #0b1d31 50%, #111735 100%);
        }
        body::before, body::after {
            content: "";
            position: fixed;
            width: 34rem;
            height: 34rem;
            border: 1px solid rgba(137, 244, 214, .12);
            border-radius: 42% 58% 67% 33% / 44% 38% 62% 56%;
            animation: drift 18s linear infinite;
            pointer-events: none;
        }
        body::before { top: -18rem; right: -10rem; }
        body::after { bottom: -20rem; left: -9rem; animation-direction: reverse; }
        @keyframes drift { to { transform: rotate(360deg); } }
        .login-shell {
            width: min(92vw, 440px);
            padding: 2.5rem;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: linear-gradient(145deg, rgba(17, 36, 57, .82), rgba(9, 21, 36, .68));
            box-shadow: 0 30px 80px rgba(0, 0, 0, .42);
            backdrop-filter: blur(22px);
        }
        .brand { display: flex; align-items: center; gap: .85rem; margin-bottom: 2rem; }
        .brand-mark {
            width: 48px; height: 48px; display: grid; place-items: center;
            border-radius: 15px; color: #06231c; font-size: 1.45rem; font-weight: 900;
            background: linear-gradient(145deg, var(--accent), #a8f3de);
            box-shadow: 0 12px 34px rgba(112, 225, 193, .25);
        }
        .brand-name { font-size: 1.55rem; font-weight: 800; letter-spacing: -.04em; }
        h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.45rem); letter-spacing: -.055em; }
        .intro { margin: .65rem 0 1.8rem; color: var(--muted); line-height: 1.55; }
        label { display: block; margin: 1rem 0 .5rem; color: #d8e6f4; font-size: .88rem; font-weight: 650; }
        select, input {
            width: 100%; border: 1px solid var(--line); border-radius: 13px;
            padding: .92rem 1rem; color: var(--ink); background: rgba(3, 12, 23, .58);
            font: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
        }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(112, 225, 193, .11); }
        button {
            width: 100%; margin-top: 1.35rem; border: 0; border-radius: 13px; padding: .95rem;
            color: #06231c; font: inherit; font-weight: 800; cursor: pointer;
            background: linear-gradient(110deg, var(--accent), #91efd5);
            box-shadow: 0 14px 34px rgba(112, 225, 193, .2); transition: transform .2s, box-shadow .2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(112, 225, 193, .28); }
        .error { padding: .75rem .9rem; border: 1px solid rgba(255, 115, 135, .35); border-radius: 12px; color: #ffc0c9; background: rgba(143, 30, 55, .22); }
        .privacy { margin: 1.25rem 0 0; text-align: center; color: #7890a8; font-size: .78rem; }
        @media (max-width: 520px) { .login-shell { padding: 1.7rem; border-radius: 22px; } }
        @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand">
            <div class="brand-mark">P</div>
            <div class="brand-name">privio</div>
        </div>
        <h1>Bem-vindo de volta.</h1>
        <p class="intro">Acesse seu espaço financeiro com a função adequada para você.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form action="/login" method="post">
            <input type="hidden" name="next_path" value="{{ next_path }}">
            <label for="role">Tipo de acesso</label>
            <select id="role" name="role" required>
                <option value="editor">Editor</option>
                <option value="viewer">Viewer</option>
            </select>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required autofocus>
            <button type="submit">Entrar no Privio</button>
        </form>
        <p class="privacy">Sessão protegida · Suas credenciais não são armazenadas no navegador</p>
    </main>
</body>
</html>
