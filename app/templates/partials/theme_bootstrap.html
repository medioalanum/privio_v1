<script>
(() => {
 const allowed = ['auto','light','dark'];
 let preference = 'auto';
 try { const saved = localStorage.getItem('privio-theme'); if(allowed.includes(saved)) preference = saved; } catch (_) {}
 const system = window.matchMedia('(prefers-color-scheme: dark)');
 function apply() {
  document.documentElement.dataset.theme = preference === 'auto' ? (system.matches ? 'dark' : 'light') : preference;
  document.querySelectorAll('[data-theme-choice]').forEach(input => { input.checked = input.value === preference; });
 }
 window.privioTheme = {set(value) { if(!allowed.includes(value)) return; preference=value; try {localStorage.setItem('privio-theme', value);}catch(_){} apply(); }};
 apply(); system.addEventListener('change', () => { if(preference === 'auto') apply(); });
 document.addEventListener('DOMContentLoaded', () => {
  apply(); document.querySelectorAll('[data-theme-choice]').forEach(input => input.addEventListener('change', () => window.privioTheme.set(input.value)));
 });
})();
</script>
