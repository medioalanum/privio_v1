{% if toast_message %}
    <div style="background-color: var(--pico-primary-background); color: var(--pico-primary-inverse); padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <span>{{ toast_message }}</span>
        <button type="button" onclick="this.parentElement.remove()" style="background: none; border: none; color: inherit; font-size: 1.25rem; cursor: pointer; padding: 0; margin: 0;">&times;</button>
    </div>
{% endif %}
