# Render Blueprint Specification (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: privio-commitments-app
    runtime: python
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH=\"$HOME/.local/bin:$PATH\" && uv sync --frozen --no-dev"
    startCommand: "export PATH=\"$HOME/.local/bin:$PATH\" && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Privio Commitments API"
      - key: DATABASE_URL
        sync: false  # Paste your Neon PostgreSQL connection string in Render Dashboard
      - key: EDITOR_USER
        value: editor
      - key: EDITOR_PASS
        generateValue: true  # Render generates a secure random password automatically
      - key: VIEWER_USER
        value: viewer
      - key: VIEWER_PASS
        generateValue: true  # Render generates a secure random password automatically
      - key: SESSION_SECRET
        generateValue: true  # Signs secure browser session cookies
