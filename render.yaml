# Render Blueprint Specification (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: privio-commitments-app
    runtime: python
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH=\"$HOME/.local/bin:$PATH\" && uv sync --frozen --no-dev"
    startCommand: "export PATH=\"$HOME/.local/bin:$PATH\" && sh scripts/start.sh"
    plan: free
    autoDeployTrigger: off  # Deploy explicitly after validating changes.
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Privio Commitments API"
      - key: DATABASE_URL
        sync: false  # Paste your Neon PostgreSQL connection string in Render Dashboard
      - key: ADMIN_USER
        value: admin
      - key: CLIENT_USER
        value: client
      - key: ADMIN_PASS
        sync: false  # Supply the existing Admin password; never regenerate on migration.
      - key: CLIENT_PASS
        sync: false  # Supply the existing Client password.
      - key: SESSION_SECRET
        generateValue: true  # Signs secure browser session cookies
