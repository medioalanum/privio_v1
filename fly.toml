# Fly.io configuration file
# Documentation: https://fly.io/docs/reference/configuration/

app = "privio-commitments"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  APP_NAME = "Privio Commitments API"
  PORT = "8000"
